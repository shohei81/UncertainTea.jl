name = "UncertainTeaEnzymeTests"

# Isolated environment for the Enzyme reverse-mode extension (issue #268). NOT
# part of the package test target: Enzyme is a heavy, version-sensitive
# dependency, so it is kept out of the core test matrix. It runs in CI via the
# dedicated .github/workflows/enzyme.yml workflow (weekly + on PRs touching
# the fragile contract files; issue #333).
#
# Setup + run (from the repository root):
#   julia --project=test/enzyme -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
#   julia --project=test/enzyme test/enzyme/runtests.jl

[deps]
Enzyme = "7da242da-08ed-463a-9acd-ee780be4f1d9"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
UncertainTea = "9b1291ec-f7ff-476f-9e6f-459056809ae0"

[sources]
UncertainTea = {path = "../.."}

[compat]
Enzyme = "0.13"
ForwardDiff = "0.10, 1"
julia = "1.10"
